<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧩 Prompt Puzzle — Master AI Prompting Through Play</title>
<style>
  :root{
    --bg1:#0f0c29; --bg2:#302b63; --bg3:#24243e;
    --accent:#7f5af0; --accent2:#2cb67d; --danger:#ff5c7c; --warn:#ffb84c;
    --card:#1b1b2f; --card2:#232342; --text:#e6e6f0; --muted:#9a97b8;
    --glass: rgba(255,255,255,0.06);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    background: radial-gradient(1200px 800px at 10% 10%, #2c2660 0%, transparent 60%),
                radial-gradient(1000px 700px at 90% 90%, #1a3a3a 0%, transparent 60%),
                linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
    color:var(--text); min-height:100vh; overflow-x:hidden;
  }
  #app{max-width:1200px;margin:0 auto;padding:24px 18px 80px;}
  h1,h2,h3{margin:0 0 8px;}
  .title-bar{text-align:center;margin-bottom:28px;}
  .title-bar h1{
    font-size:2.3rem; background:linear-gradient(90deg,#7f5af0,#2cb67d,#ffb84c);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    letter-spacing:0.5px; animation:hueShift 8s infinite linear;
  }
  @keyframes hueShift{0%{filter:hue-rotate(0deg);}100%{filter:hue-rotate(360deg);}}
  .title-bar p{color:var(--muted); font-size:0.95rem;}

  .glass{
    background:var(--glass); backdrop-filter: blur(14px);
    border:1px solid rgba(255,255,255,0.09); border-radius:var(--radius);
  }
  .card{
    background:linear-gradient(145deg,var(--card),var(--card2));
    border:1px solid rgba(255,255,255,0.07);
    border-radius:var(--radius); padding:22px; margin-bottom:20px;
    box-shadow:0 8px 30px rgba(0,0,0,0.35);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .card:hover{ box-shadow:0 12px 40px rgba(127,90,240,0.25); }

  button{
    cursor:pointer; border:none; font-family:inherit; font-weight:600;
    border-radius:10px; padding:12px 20px; font-size:0.95rem;
    transition:transform .15s ease, box-shadow .15s ease, background .2s;
  }
  button:active{ transform:scale(0.96); }
  .btn-primary{
    background:linear-gradient(120deg,var(--accent),#5b3fd4); color:#fff;
    box-shadow:0 4px 18px rgba(127,90,240,0.45);
  }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 8px 24px rgba(127,90,240,0.6);}
  .btn-secondary{
    background:rgba(255,255,255,0.08); color:var(--text); border:1px solid rgba(255,255,255,0.14);
  }
  .btn-secondary:hover{ background:rgba(255,255,255,0.14); }
  .btn-ghost{ background:transparent; color:var(--muted); border:1px dashed rgba(255,255,255,0.2);}
  .btn-ghost:hover{ color:var(--text); border-color:var(--accent);}

  select, input[type=text]{
    background:rgba(255,255,255,0.06); color:var(--text); border:1px solid rgba(255,255,255,0.15);
    border-radius:10px; padding:10px 14px; font-size:0.95rem; outline:none;
  }
  select:focus, input:focus{ border-color:var(--accent); }

  /* Setup screen */
  .setup-grid{display:flex; flex-direction:column; gap:18px; align-items:center;}
  .option-row{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
  .option-btn{
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12);
    color:var(--text); padding:14px 18px; border-radius:12px; min-width:150px;
    text-align:center; font-weight:600;
  }
  .option-btn.selected{
    background:linear-gradient(120deg,var(--accent),#5b3fd4); box-shadow:0 6px 20px rgba(127,90,240,0.5);
    border-color:transparent;
  }
  .option-btn:hover{ transform:translateY(-2px); }

  /* HUD */
  .hud{
    display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center;
    margin-bottom:20px; padding:14px 18px;
  }
  .hud .stats{ display:flex; gap:18px; flex-wrap:wrap; }
  .stat{ text-align:center; min-width:70px; }
  .stat .val{ font-size:1.3rem; font-weight:700; }
  .stat .lbl{ font-size:0.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;}
  .progress-bar{
    width:100%; height:8px; border-radius:6px; background:rgba(255,255,255,0.08); overflow:hidden; margin-top:6px;
  }
  .progress-fill{
    height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .4s ease; border-radius:6px;
  }

  /* Scenario */
  .badge{
    display:inline-block; padding:4px 12px; border-radius:20px; font-size:0.75rem; font-weight:700;
    background:rgba(127,90,240,0.2); color:#c8b6ff; border:1px solid rgba(127,90,240,0.4);
    margin-right:8px;
  }
  .badge.type2{ background:rgba(44,182,125,0.18); color:#8ee6bd; border-color:rgba(44,182,125,0.4);}
  .badge.type3{ background:rgba(255,184,76,0.18); color:#ffd28f; border-color:rgba(255,184,76,0.4);}

  .desired-output{
    background:rgba(0,0,0,0.25); border-left:3px solid var(--accent2);
    padding:14px 16px; border-radius:8px; margin:12px 0; font-size:0.92rem; color:#d4d4e8;
    font-family:'Consolas',monospace; white-space:pre-wrap;
  }

  .block-zone{
    min-height:70px; border:2px dashed rgba(255,255,255,0.18); border-radius:12px;
    padding:12px; display:flex; flex-direction:column; gap:8px; background:rgba(255,255,255,0.02);
    transition:border-color .2s, background .2s;
  }
  .block-zone.dragover{ border-color:var(--accent); background:rgba(127,90,240,0.08); }
  .prompt-block{
    background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.14);
    border-radius:10px; padding:12px 14px; cursor:grab; font-size:0.9rem;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    transition:transform .15s, box-shadow .15s, background .2s;
  }
  .prompt-block:hover{ transform:translateY(-2px); background:rgba(255,255,255,0.12); box-shadow:0 4px 14px rgba(0,0,0,0.3);}
  .prompt-block.dragging{ opacity:0.4; }
  .prompt-block.correct-flash{ animation:flashGreen .6s ease; }
  .prompt-block.wrong-flash{ animation:flashRed .6s ease; }
  @keyframes flashGreen{ 0%{background:rgba(44,182,125,0.5);} 100%{background:rgba(255,255,255,0.07);} }
  @keyframes flashRed{ 0%{background:rgba(255,92,124,0.5);} 100%{background:rgba(255,255,255,0.07);} }
  .remove-x{ color:var(--danger); font-weight:900; cursor:pointer; padding:2px 6px; border-radius:6px;}
  .remove-x:hover{ background:rgba(255,92,124,0.2); }

  .zones-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media(max-width:760px){ .zones-wrap{grid-template-columns:1fr;} }
  .zone-label{ font-size:0.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:8px; font-weight:700;}

  .choice-card{
    border:2px solid rgba(255,255,255,0.1); border-radius:12px; padding:16px; margin-bottom:12px;
    cursor:pointer; background:rgba(255,255,255,0.03); transition:all .2s;
    font-family:'Consolas',monospace; white-space:pre-wrap; font-size:0.88rem;
  }
  .choice-card:hover{ border-color:var(--accent); background:rgba(127,90,240,0.06); transform:translateX(4px); }
  .choice-card.selected{ border-color:var(--accent); background:rgba(127,90,240,0.15); }
  .choice-card.correct{ border-color:var(--accent2); background:rgba(44,182,125,0.15); }
  .choice-card.incorrect{ border-color:var(--danger); background:rgba(255,92,124,0.15); }

  .action-row{ display:flex; gap:12px; flex-wrap:wrap; margin-top:16px; justify-content:flex-end;}

  /* Toast notifications */
  #toast-container{ position:fixed; top:20px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:10px;}
  .toast{
    padding:14px 20px; border-radius:12px; font-weight:600; color:#fff; min-width:220px;
    box-shadow:0 8px 24px rgba(0,0,0,0.4); animation:slideIn .35s ease, fadeOut .4s ease 2.6s forwards;
  }
  .toast.good{ background:linear-gradient(120deg,#2cb67d,#1e8a5c); }
  .toast.bad{ background:linear-gradient(120deg,#ff5c7c,#c23a54); }
  .toast.info{ background:linear-gradient(120deg,#7f5af0,#5b3fd4); }
  @keyframes slideIn{ from{transform:translateX(120%); opacity:0;} to{transform:translateX(0); opacity:1;} }
  @keyframes fadeOut{ to{opacity:0; transform:translateX(60px);} }

  /* Report */
  .dna-bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .dna-label{ width:140px; font-size:0.82rem; color:var(--muted); }
  .dna-track{ flex:1; height:14px; border-radius:8px; background:rgba(255,255,255,0.07); overflow:hidden;}
  .dna-fill{ height:100%; border-radius:8px; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width 1s ease;}
  .dna-val{ width:40px; text-align:right; font-size:0.8rem; color:var(--muted);}

  .rank-badge{
    display:inline-block; font-size:1.6rem; font-weight:900; padding:10px 26px; border-radius:16px;
    background:linear-gradient(120deg,#ffb84c,#ff9d4c); color:#2a1a00; margin:10px 0;
    box-shadow:0 6px 20px rgba(255,184,76,0.4);
  }
  .score-big{ font-size:3rem; font-weight:900; background:linear-gradient(90deg,#7f5af0,#2cb67d); -webkit-background-clip:text; background-clip:text; color:transparent;}

  .hidden{ display:none !important; }
  .final-prompt-box{
    background:rgba(0,0,0,0.3); border:1px solid rgba(44,182,125,0.4); border-radius:10px; padding:16px;
    font-family:'Consolas',monospace; font-size:0.88rem; white-space:pre-wrap; color:#c9f6de; margin-top:10px;
  }
  .principle-box{
    background:rgba(255,184,76,0.08); border-left:3px solid var(--warn); padding:12px 14px; border-radius:8px;
    font-size:0.87rem; margin-top:14px; color:#ffe4b0;
  }
  .hint-box{
    background:rgba(127,90,240,0.1); border-left:3px solid var(--accent); padding:12px 14px; border-radius:8px;
    font-size:0.87rem; margin-top:10px; color:#d8c9ff;
  }
  .footer-note{ text-align:center; color:var(--muted); font-size:0.8rem; margin-top:40px;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15); border-radius:8px;}
</style>
</head>

<script>

    overEngineeredPrompt: `As the world's greatest 100x Python architect with 50 years of experience, meticulously and exhaustively refactor, restructure, re-architect, optimize, document, annotate, unit test, benchmark, and philosophically justify every single line of this function while explaining quantum computing analogies and providing 12 alternative implementations with pros/cons matrices spanning multiple pages, then translate it to 5 other languages just in case.`,

    title: 'Clean a Cluttered API Documentation Prompt',

    optimizedPrompt: `Write REST API documentation for a /users GET endpoint.
Include query parameters, example JSON response, and possible error codes.
Format it in Markdown with headers for each section.
Keep the tone professional and concise.`,
    weakOutput: `GET /users returns users. Has some params. JSON response. Errors possible. Btw pizza is great and here are some laptop options: Dell XPS, MacBook Air...`,
    optimizedOutput: `## GET /users\n\n**Query Parameters**\n- \`limit\` (integer) — max results to return\n- \`offset\` (integer) — pagination offset\n\n**Example Response**\n\`\`\`json\n{ "users": [{ "id": 1, "name": "Jane Doe" }], "total": 42 }\n\`\`\`\n\n**Error Codes**\n- \`400\` Invalid query parameter\n- \`401\` Unauthorized\n- \`500\` Server error`,

  {

    title: 'Choose the Best Prompt: SQL Query Generation',

  {
    id: 'sw4',

  {

  },
  {
    id: 'sw6',

    title: 'Choose the Best Prompt: Optimizing a Slow Algorithm',

    overEngineeredPrompt: `You are an omniscient algorithmic god who has solved P vs NP. Provide a full formal proof of optimality, benchmark this function against 15 different data structures, discuss cache locality at the CPU register level, rewrite it in 6 programming languages, and include a Big-O complexity lecture spanning multiple chapters before eventually showing any code.`,
    weakOutput: `Here's the same code but with some comments added. Should be a bit faster maybe.`,
    optimizedOutput: `The original function uses nested loops to check for duplicates, resulting in O(n²) time. Using a hash set to track seen values reduces this to O(n).\n\n\`\`\`js\nfunction hasDuplicate(arr) {\n  const seen = new Set();\n  for (const val of arr) {\n    if (seen.has(val)) return true;\n    seen.add(val);\n  }\n  return false;\n}\n\`\`\``,

      { text: `You are an omniscient algorithmic god who has solved P vs NP... Big-O complexity lecture spanning multiple chapters before eventually showing any code.`, label:'Over-engineered'}

  {
    id: 'sw7',
    type: 'build',
    title: 'Generating a Git Commit Message',
    desiredOutput: `A well-formatted conventional-commit style message summarizing a bug fix in the authentication module.`,

/* ---------------------- STATE ---------------------- */
let STATE = {
  domain: null,
  difficulty: null,
  scenarios: [],
  currentIndex: 0,
  score: 0,
  moves: 0,
  wrongPlacements: 0,
  hintsUsed: 0,
  startTime: null,
  scenarioResults: [], // {scenarioId, accuracy, timeTaken, optimizationBonus}
  currentBlocksPlaced: [],
  currentZoneBlocks: [],
};

const app = document.getElementById('app');

/* ---------------------- UTIL ---------------------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pickRandomScenarios(list, count){
  return shuffle(list).slice(0, count);
}
function toast(msg, type='info'){
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(()=> t.remove(), 3000);
}
function fmtTime(sec){
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}

/* ---------------------- RENDER: SETUP SCREEN ---------------------- */
function renderSetup(){

/* ---------------------- START GAME ---------------------- */
function startGame(){
  // Currently only Software/Coding Intermediate has authored scenarios.
  // For other domain/difficulty combos, we still use the software bank
  // (reusable JS objects) so the app never breaks offline.
  let bank = SCENARIOS_SOFTWARE_INTERMEDIATE;
  const count = Math.min(7, bank.length);
  STATE.scenarios = pickRandomScenarios(bank, count);
  STATE.currentIndex = 0;
  STATE.score = 0;
  STATE.moves = 0;
  STATE.wrongPlacements = 0;
  STATE.hintsUsed = 0;
  STATE.scenarioResults = [];
  toast(`Domain: ${STATE.domain} • Difficulty: ${STATE.difficulty}`, 'info');
  renderScenario();
}

/* ---------------------- HUD ---------------------- */
function renderHUD(){
  const total = STATE.scenarios.length;
  const pct = Math.round((STATE.currentIndex/total)*100);
  return `
    <div class="card hud">
      <div class="stats">
        <div class="stat"><div class="val">${STATE.score}</div><div class="lbl">Score</div></div>
        <div class="stat"><div class="val">${STATE.moves}</div><div class="lbl">Moves</div></div>
        <div class="stat"><div class="val">${STATE.wrongPlacements}</div><div class="lbl">Wrong</div></div>
        <div class="stat"><div class="val">${STATE.hintsUsed}</div><div class="lbl">Hints</div></div>
        <div class="stat"><div class="val">${STATE.currentIndex+1}/${total}</div><div class="lbl">Scenario</div></div>
      </div>
      <div style="flex:1; min-width:180px;">
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;"></div></div>
      </div>
    </div>
  `;
}

/* ---------------------- RENDER SCENARIO ROUTER ---------------------- */
function renderScenario(){
  if(STATE.currentIndex >= STATE.scenarios.length){
    renderReport();
    return;
  }
  const sc = STATE.scenarios[STATE.currentIndex];
  STATE.startTime = Date.now();
  STATE.currentScenarioWrong = 0;
  STATE.currentScenarioHints = 0;
  STATE.currentScenarioMoves = 0;

  if(sc.type === 'build') renderBuildChallenge(sc);
  else if(sc.type === 'clean') renderCleanChallenge(sc);
  else if(sc.type === 'choose') renderChooseChallenge(sc);
}

/* ---------------------- CHALLENGE 1: BUILD THE PROMPT ---------------------- */
function renderBuildChallenge(sc){
  const allBlocks = shuffle(sc.correctBlocks.map((t,i)=>({text:t, correct:true, id:'c'+i}))
    .concat(sc.distractorBlocks.map((t,i)=>({text:t, correct:false, id:'d'+i}))));

  STATE.currentZoneBlocks = []; // blocks placed in the prompt zone (ids)

  app.innerHTML = `
    ${renderHUD()}
    <div class="card">
      <span class="badge">Build the Prompt</span>
      <h2>${sc.title}</h2>
      <div class="zone-label">Desired Output</div>
      <div class="desired-output">${escapeHtml(sc.desiredOutput)}</div>

      <div class="zones-wrap" style="margin-top:18px;">
        <div>
          <div class="zone-label">🧱 Available Blocks (drag from here)</div>
          <div class="block-zone" id="pool-zone">
            ${allBlocks.map(b=>renderDraggableBlock(b)).join('')}
          </div>
        </div>
        <div>
          <div class="zone-label">✍️ Your Prompt (drop here in order)</div>
          <div class="block-zone" id="prompt-zone" data-empty-msg="Drag blocks here to build your prompt..."></div>
        </div>
      </div>

      <div class="action-row">
        <button class="btn-ghost" id="hint-btn">💡 Hint (-5 pts)</button>
        <button class="btn-secondary" id="reset-btn">↺ Reset</button>
        <button class="btn-primary" id="submit-btn">✅ Submit Prompt</button>
      </div>
      <div id="feedback-area"></div>
    </div>
  `;

  setupDragAndDrop();

  document.getElementById('hint-btn').addEventListener('click', ()=>{
    STATE.hintsUsed++;
    STATE.currentScenarioHints++;
    document.getElementById('feedback-area').innerHTML = `<div class="hint-box">💡 Hint: ${sc.principle}</div>`;
    toast('Hint revealed (-5 pts)', 'info');
  });

  document.getElementById('reset-btn').addEventListener('click', ()=> renderBuildChallenge(sc));

  document.getElementById('submit-btn').addEventListener('click', ()=>{
    evaluateBuildChallenge(sc);
  });
}

function renderDraggableBlock(b){
  return `<div class="prompt-block" draggable="true" data-id="${b.id}" data-correct="${b.correct}">
    <span>${escapeHtml(b.text)}</span>
  </div>`;
}

function setupDragAndDrop(){
  let draggedEl = null;

  function attachDrag(container){
    container.querySelectorAll('.prompt-block').forEach(block=>{
      block.addEventListener('dragstart', (e)=>{
        draggedEl = block;
        setTimeout(()=> block.classList.add('dragging'), 0);
      });
      block.addEventListener('dragend', ()=>{
        block.classList.remove('dragging');
      });
    });
  }

  const poolZone = document.getElementById('pool-zone');
  const promptZone = document.getElementById('prompt-zone');
  attachDrag(poolZone);

  [poolZone, promptZone].forEach(zone=>{
    zone.addEventListener('dragover', (e)=>{
      e.preventDefault();
      zone.classList.add('dragover');
    });
    zone.addEventListener('dragleave', ()=> zone.classList.remove('dragover'));
    zone.addEventListener('drop', (e)=>{
      e.preventDefault();
      zone.classList.remove('dragover');
      if(draggedEl){
        zone.appendChild(draggedEl);
        attachDrag(zone);
        STATE.moves++;
        STATE.currentScenarioMoves++;
      }
    });
  });
}

function evaluateBuildChallenge(sc){
  const promptZone = document.getElementById('prompt-zone');
  const placed = Array.from(promptZone.querySelectorAll('.prompt-block'));
  const totalCorrect = sc.correctBlocks.length;
  let correctPlaced = 0;
  let wrongPlaced = 0;

  placed.forEach(block=>{
    const isCorrect = block.dataset.correct === 'true';
    if(isCorrect){
      correctPlaced++;
      block.classList.add('correct-flash');
    } else {
      wrongPlaced++;
      STATE.wrongPlacements++;
      STATE.currentScenarioWrong++;
      block.classList.add('wrong-flash');
    }
  });

  const accuracy = Math.max(0, Math.round(((correctPlaced - wrongPlaced) / totalCorrect) * 100));
  const timeTaken = (Date.now() - STATE.startTime)/1000;
  const timeBonus = Math.max(0, 30 - Math.floor(timeTaken/2));
  const hintPenalty = STATE.currentScenarioHints * 5;
  const optimizationBonus = (correctPlaced === totalCorrect && wrongPlaced === 0) ? 25 : 0;
  const rawScore = Math.max(0, (correctPlaced*15) - (wrongPlaced*10) + timeBonus + optimizationBonus - hintPenalty);

  STATE.score += rawScore;
  STATE.scenarioResults.push({
    id: sc.id, title: sc.title, type:'Build the Prompt',
    accuracy: Math.min(100, Math.max(0, accuracy)),
    timeTaken, optimizationBonus, hints: STATE.currentScenarioHints, wrong: STATE.currentScenarioWrong
  });

  toast(optimizationBonus>0 ? '🌟 Perfect build! +Optimization Bonus' : `Scored +${rawScore} pts`, optimizationBonus>0?'good':'info');

  document.getElementById('feedback-area').innerHTML = `
    <div class="principle-box">📘 <strong>Prompt Principle:</strong> ${sc.principle}</div>
    <div style="margin-top:14px;">
      <div class="zone-label">Optimized Prompt</div>
      <div class="desired-output">${escapeHtml(sc.optimizedPrompt)}</div>
    </div>
    <div class="action-row">
      <button class="btn-primary" id="next-btn">Continue →</button>
    </div>
  `;
  document.getElementById('next-btn').addEventListener('click', nextScenario);
}

/* ---------------------- CHALLENGE 2: CLEAN THE PROMPT ---------------------- */
function renderCleanChallenge(sc){
  const shuffled = shuffle(sc.messyPrompt.map((m,i)=>({...m, id:'m'+i})));
  STATE.cleanSelections = {}; // id -> boolean (kept)

  app.innerHTML = `
    ${renderHUD()}
    <div class="card">
      <span class="badge type2">Clean the Prompt</span>
      <h2>${sc.title}</h2>
      <div class="zone-label">Desired Output</div>
      <div class="desired-output">${escapeHtml(sc.desiredOutput)}</div>

      <div class="zone-label" style="margin-top:18px;">🧹 Click each line to toggle KEEP / REMOVE. Keep only what belongs in a clean, focused prompt.</div>
      <div id="clean-list">
        ${shuffled.map(m=>`
          <div class="prompt-block clean-item" data-id="${m.id}" data-keep="${m.keep}" style="cursor:pointer;">
            <span>${escapeHtml(m.text)}</span>
            <span class="clean-tag" style="font-size:0.75rem; color:var(--muted);">click to mark</span>
          </div>
        `).join('')}
      </div>

      <div class="action-row">
        <button class="btn-ghost" id="hint-btn">💡 Hint (-5 pts)</button>
        <button class="btn-primary" id="submit-btn">✅ Submit Cleaned Prompt</button>
      </div>
      <div id="feedback-area"></div>
    </div>
  `;

  const kept = new Set();
  document.querySelectorAll('.clean-item').forEach(item=>{
    item.addEventListener('click', ()=>{
      const id = item.dataset.id;
      if(kept.has(id)){
        kept.delete(id);
        item.style.opacity = '1';
        item.querySelector('.clean-tag').textContent = 'click to mark';
        item.style.borderColor = 'rgba(255,255,255,0.14)';
      } else {
        kept.add(id);
        item.style.opacity = '1';
        item.querySelector('.clean-tag').textContent = '✅ KEEP';
        item.style.borderColor = 'var(--accent2)';
      }
      STATE.moves++;
      STATE.currentScenarioMoves++;
    });
  });

  document.getElementById('hint-btn').addEventListener('click', ()=>{
    STATE.hintsUsed++;
    STATE.currentScenarioHints++;
    document.getElementById('feedback-area').innerHTML = `<div class="hint-box">💡 Hint: ${sc.principle}</div>`;
    toast('Hint revealed (-5 pts)', 'info');
  });

  document.getElementById('submit-btn').addEventListener('click', ()=>{
    evaluateCleanChallenge(sc, kept);
  });
}

function evaluateCleanChallenge(sc, kept){
  const items = document.querySelectorAll('.clean-item');
  let correctDecisions = 0;
  let wrongDecisions = 0;

  items.forEach(item=>{
    const id = item.dataset.id;
    const shouldKeep = item.dataset.keep === 'true';
    const didKeep = kept.has(id);
    if(shouldKeep === didKeep){
      correctDecisions++;
      item.classList.add('correct-flash');
    } else {
      wrongDecisions++;
      STATE.wrongPlacements++;
      STATE.currentScenarioWrong++;
      item.classList.add('wrong-flash');
    }
  });

  const total = items.length;
  const accuracy = Math.round((correctDecisions/total)*100);
  const timeTaken = (Date.now() - STATE.startTime)/1000;
  const timeBonus = Math.max(0, 30 - Math.floor(timeTaken/2));
  const hintPenalty = STATE.currentScenarioHints * 5;
  const optimizationBonus = (wrongDecisions === 0) ? 25 : 0;
  const rawScore = Math.max(0, (correctDecisions*12) - (wrongDecisions*10) + timeBonus + optimizationBonus - hintPenalty);

  STATE.score += rawScore;
  STATE.scenarioResults.push({
    id: sc.id, title: sc.title, type:'Clean the Prompt',
    accuracy, timeTaken, optimizationBonus, hints: STATE.currentScenarioHints, wrong: STATE.currentScenarioWrong
  });

  toast(optimizationBonus>0 ? '🌟 Perfectly cleaned! +Optimization Bonus' : `Scored +${rawScore} pts`, optimizationBonus>0?'good':'info');

  document.getElementById('feedback-area').innerHTML = `
    <div class="principle-box">📘 <strong>Prompt Principle:</strong> ${sc.principle}</div>
    <div style="margin-top:14px;">
      <div class="zone-label">Optimized Prompt</div>
      <div class="desired-output">${escapeHtml(sc.optimizedPrompt)}</div>
    </div>
    <div class="action-row">
      <button class="btn-primary" id="next-btn">Continue →</button>
    </div>
  `;
  document.getElementById('next-btn').addEventListener('click', nextScenario);
}

/* ---------------------- CHALLENGE 3: CHOOSE THE BEST PROMPT ---------------------- */
function renderChooseChallenge(sc){

function evaluateChooseChallenge(sc, isCorrect){
  const timeTaken = (Date.now() - STATE.startTime)/1000;
  const timeBonus = Math.max(0, 30 - Math.floor(timeTaken/2));
  const hintPenalty = STATE.currentScenarioHints * 5;

/* ---------------------- FINAL REPORT ---------------------- */
function renderReport(){
  const results = STATE.scenarioResults;
  const avgAccuracy = Math.round(results.reduce((s,r)=>s+r.accuracy,0)/results.length) || 0;
  const totalTime = results.reduce((s,r)=>s+r.timeTaken,0);
  const totalOptBonus = results.reduce((s,r)=>s+r.optimizationBonus,0);
  const totalHints = STATE.hintsUsed;
  const totalWrong = STATE.wrongPlacements;

  let rating, rank;
  if(STATE.score >= 380){ rating='Exceptional'; rank='🏆 Prompt Grandmaster'; }
  else if(STATE.score >= 300){ rating='Excellent'; rank='🥇 Prompt Architect'; }
  else if(STATE.score >= 220){ rating='Strong'; rank='🥈 Prompt Engineer'; }
  else if(STATE.score >= 140){ rating='Developing'; rank='🥉 Prompt Apprentice'; }
  else { rating='Needs Practice'; rank='🌱 Prompt Novice'; }

  // Prompt DNA dimensions (derived heuristically from performance)
  const dna = {
    'Clarity': Math.min(100, avgAccuracy + (totalWrong===0?10:0)),
    'Specificity': Math.min(100, avgAccuracy - totalWrong*3 + 15),
    'Structure': Math.min(100, 100 - (totalHints*8)),
    'Constraint Setting': Math.min(100, avgAccuracy - totalHints*4 + 10),
    'Efficiency (Speed)': Math.min(100, Math.max(20, 100 - Math.round(totalTime/results.length))),
  };
  Object.keys(dna).forEach(k=> dna[k] = Math.max(5, Math.min(100, Math.round(dna[k]))));

  const bestScenario = STATE.scenarios[0]; // for a representative final optimized prompt
  const weakestDim = Object.entries(dna).sort((a,b)=>a[1]-b[1])[0];

  let feedback = '';
  if(totalWrong === 0 && totalHints === 0){
    feedback = "Outstanding discipline — you built clean, precise prompts without relying on hints. You clearly understand how role assignment, constraints, and scoping work together.";
  } else if(totalHints > 3){
    feedback = "You leaned on hints often. Try to identify the core prompting principle (role, constraint, format, scope) before requesting help — it's the fastest way to internalize the pattern.";
  } else if(totalWrong > 3){
    feedback = "Watch out for distractor instructions that sound helpful but add unfocused scope. Strong prompts stay tightly scoped to the single desired output.";
  } else {
    feedback = "Solid, consistent performance. You're recognizing the difference between vague, optimized, and over-engineered prompts — keep sharpening your sense of scope and constraint.";
  }

  const nextMilestone = STATE.score < 140 ? '140 pts — reach Prompt Apprentice rank'
    : STATE.score < 220 ? '220 pts — reach Prompt Engineer rank'
    : STATE.score < 300 ? '300 pts — reach Prompt Architect rank'
    : STATE.score < 380 ? '380 pts — reach Prompt Grandmaster rank'
    : 'You have reached the top rank! Replay for a new personal best.';

  app.innerHTML = `
    <div class="title-bar">
      <h1>🧩 Prompt Performance Report</h1>
      <p>Domain: ${STATE.domain} • Difficulty: ${STATE.difficulty}</p>
    </div>

    <div class="card" style="text-align:center;">
      <div class="score-big">${STATE.score}</div>
      <div style="color:var(--muted); margin-bottom:8px;">Prompt Score</div>
      <div class="rank-badge">${rank}</div>
      <div style="font-size:1.1rem; margin-top:6px;">Rating: <strong>${rating}</strong></div>
    </div>

    <div class="card">
      <h3>🧬 Prompt DNA</h3>
      ${Object.entries(dna).map(([k,v])=>`
        <div class="dna-bar-row">
          <div class="dna-label">${k}</div>
          <div class="dna-track"><div class="dna-fill" style="width:${v}%;"></div></div>
          <div class="dna-val">${v}</div>
        </div>
      `).join('')}
    </div>

    <div class="card">
      <h3>📊 Performance Breakdown</h3>
      <div class="hud" style="padding:0;">
        <div class="stats">
          <div class="stat"><div class="val">${avgAccuracy}%</div><div class="lbl">Accuracy</div></div>
          <div class="stat"><div class="val">${fmtTime(totalTime)}</div><div class="lbl">Total Time</div></div>
          <div class="stat"><div class="val">${STATE.moves}</div><div class="lbl">Moves</div></div>
          <div class="stat"><div class="val">${totalWrong}</div><div class="lbl">Wrong</div></div>
          <div class="stat"><div class="val">${totalHints}</div><div class="lbl">Hints</div></div>
          <div class="stat"><div class="val">+${totalOptBonus}</div><div class="lbl">Opt. Bonus</div></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>💬 Personalized Feedback</h3>
      <p>${feedback}</p>
      <div class="principle-box">🎯 <strong>Focus area:</strong> ${weakestDim[0]} (${weakestDim[1]}/100) — review scenarios emphasizing this principle on your next run.</div>
      <div class="hint-box">🚩 <strong>Next Milestone:</strong> ${nextMilestone}</div>
    </div>

    <div class="card">
      <h3>✨ A Final Optimized Prompt (Example)</h3>
      <p style="color:var(--muted); font-size:0.88rem;">From "${bestScenario.title}":</p>
      <div class="final-prompt-box">${escapeHtml(bestScenario.optimizedPrompt || bestScenario.optimizedPrompt)}</div>
    </div>

    <div class="action-row" style="justify-content:center;">
      <button class="btn-secondary" id="restart-setup-btn">⚙️ Change Domain/Difficulty</button>
      <button class="btn-primary" id="replay-btn">🔁 Replay with New Scenarios</button>
    </div>
    <p class="footer-note">Prompt Puzzle — offline, single-file, zero dependencies required.</p>
  `;

  document.getElementById('replay-btn').addEventListener('click', ()=>{
    startGame();
  });
  document.getElementById('restart-setup-btn').addEventListener('click', renderSetup);
}

/* ---------------------- HELPERS ---------------------- */
function escapeHtml(str){
  if(!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------------------- INIT ---------------------- */
renderSetup();
</script>
</body>
</html>
