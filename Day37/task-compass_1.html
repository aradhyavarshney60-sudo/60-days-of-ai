<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Compass — Tech Company</title>
<style>
  :root{
    --bg-0:#070a12;
    --bg-1:#0d1220;
    --panel:rgba(255,255,255,0.045);
    --panel-border:rgba(255,255,255,0.09);
    --ink:#e9edf7;
    --ink-dim:#9aa4bd;
    --accent:#5eead4;
    --accent-2:#818cf8;
    --warn:#fbbf24;
    --good:#34d399;
    --frontend:#38bdf8;
    --backend:#a78bfa;
    --qa:#fbbf24;
    --pm:#fb7185;
    --ux:#2dd4bf;
    --support:#4ade80;
    --em:#f472b6;
    --sales:#f97316;
    --radius:18px;
    --radius-sm:12px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Segoe UI',ui-sans-serif,system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 700px at 12% -10%, rgba(94,234,212,0.10), transparent 60%),
      radial-gradient(1000px 800px at 100% 10%, rgba(129,140,248,0.12), transparent 55%),
      linear-gradient(180deg,var(--bg-0),var(--bg-1) 60%,var(--bg-0));
    min-height:100vh;
    overflow-x:hidden;
  }
  .bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:float 18s ease-in-out infinite;}
  .orb1{width:420px;height:420px;background:var(--accent);top:-120px;left:-100px;}
  .orb2{width:380px;height:380px;background:var(--accent-2);bottom:-140px;right:-100px;animation-delay:-6s;}
  .orb3{width:260px;height:260px;background:var(--pm);top:40%;left:60%;animation-delay:-11s;}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(30px,-25px) scale(1.08);}}

  .wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:28px 20px 80px;}

  header.top{text-align:center;margin-bottom:22px;}
  header.top h1{
    font-size:clamp(28px,5vw,42px);
    margin:0 0 4px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:.5px;
    font-weight:800;
  }
  header.top p{color:var(--ink-dim);margin:0;font-size:15px;}

  .progress-wrap{max-width:640px;margin:22px auto 0;}
  .progress-stages{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;color:var(--ink-dim);}
  .progress-stages span.active{color:var(--accent);font-weight:700;}
  .progress-track{height:8px;border-radius:99px;background:rgba(255,255,255,0.07);overflow:hidden;border:1px solid var(--panel-border);}
  .progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s cubic-bezier(.4,0,.2,1);}

  .stage-intro{
    text-align:center;margin:34px auto 18px;max-width:640px;
    animation:fadeUp .5s ease;
  }
  .stage-intro .badge{
    display:inline-block;padding:5px 14px;border-radius:99px;font-size:12px;font-weight:700;
    background:rgba(94,234,212,0.12);color:var(--accent);border:1px solid rgba(94,234,212,0.3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px;
  }
  .stage-intro h2{font-size:26px;margin:6px 0;}
  .stage-intro p{color:var(--ink-dim);font-size:15px;line-height:1.5;}

  .panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:var(--radius);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    padding:26px;
    margin:18px 0;
    animation:fadeUp .45s ease;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  .ticket{
    background:linear-gradient(135deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));
    border:1px dashed rgba(255,255,255,0.18);
    border-radius:var(--radius-sm);
    padding:18px 20px;
    margin-bottom:20px;
    position:relative;
  }
  .ticket .tag{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-dim);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .ticket .tag::before{content:"🎫";}
  .ticket h3{margin:0 0 8px;font-size:19px;line-height:1.4;font-weight:700;}
  .ticket p.meta{margin:0;color:var(--ink-dim);font-size:13px;}

  .roles-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:6px;}
  .role-card{
    cursor:grab;
    user-select:none;
    padding:14px 12px;
    border-radius:var(--radius-sm);
    border:1px solid var(--panel-border);
    background:rgba(255,255,255,0.04);
    text-align:center;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
    position:relative;
  }
  .role-card:hover{transform:translateY(-4px);border-color:var(--role-color,var(--accent));box-shadow:0 10px 24px -8px var(--role-color,rgba(94,234,212,.5));}
  .role-card.dragging{opacity:.4;}
  .role-card .emoji{font-size:26px;display:block;margin-bottom:6px;}
  .role-card .name{font-weight:700;font-size:13.5px;}
  .role-card .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--role-color,var(--accent));}

  .dropzone{
    margin-top:18px;
    min-height:86px;
    border:2px dashed rgba(255,255,255,0.16);
    border-radius:var(--radius-sm);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-dim);
    font-size:14px;
    transition:all .2s ease;
    background:rgba(255,255,255,0.02);
    text-align:center;
    padding:10px;
  }
  .dropzone.dragover{border-color:var(--accent);background:rgba(94,234,212,0.08);color:var(--accent);}
  .dropzone.filled{border-style:solid;border-color:var(--accent);background:rgba(94,234,212,0.07);}
  .dropzone .filled-card{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink);}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    color:#04121a;font-weight:800;border:none;
    padding:12px 24px;border-radius:99px;cursor:pointer;font-size:14.5px;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 8px 22px -8px rgba(94,234,212,.55);
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px -8px rgba(94,234,212,.7);}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn.ghost{background:transparent;border:1px solid var(--panel-border);color:var(--ink);box-shadow:none;}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent);}
  .actions{display:flex;justify-content:center;gap:12px;margin-top:22px;}

  .reveal{
    margin-top:20px;padding:18px 20px;border-radius:var(--radius-sm);
    background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.28);
    animation:fadeUp .4s ease;
  }
  .reveal h4{margin:0 0 8px;color:var(--good);font-size:15px;display:flex;gap:8px;align-items:center;}
  .reveal p{margin:6px 0;font-size:14px;line-height:1.55;color:var(--ink);}
  .reveal .assist-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .assist-chip{padding:5px 12px;border-radius:99px;font-size:12.5px;background:rgba(255,255,255,0.06);border:1px solid var(--panel-border);}

  .route-slots{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px;justify-content:center;}
  .route-slot{
    min-width:120px;min-height:64px;border:2px dashed rgba(255,255,255,0.18);
    border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;
    color:var(--ink-dim);font-size:12.5px;background:rgba(255,255,255,0.02);padding:8px;text-align:center;
    transition:all .2s ease;
  }
  .route-slot.dragover{border-color:var(--accent);background:rgba(94,234,212,0.08);}
  .route-slot.filled{border-style:solid;border-color:var(--accent-2);background:rgba(129,140,248,0.09);}
  .route-arrow{color:var(--ink-dim);font-size:20px;}
  .route-slot .filled-card{font-weight:700;color:var(--ink);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px;}

  .flow-anim{margin-top:24px;position:relative;height:70px;display:flex;align-items:center;}
  .flow-line{position:absolute;left:0;right:0;top:50%;height:3px;background:rgba(255,255,255,0.12);transform:translateY(-50%);border-radius:3px;}
  .flow-token{
    position:absolute;top:50%;width:44px;height:44px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;font-size:20px;
    transform:translate(-50%,-50%);
    box-shadow:0 0 22px rgba(94,234,212,.6);
    left:0%;
  }

  .multi-roles .role-card.selected{border-color:var(--accent);background:rgba(94,234,212,0.1);box-shadow:0 0 0 2px var(--accent) inset;}
  .multi-roles .role-card.selected .name::after{content:" ✓";color:var(--accent);}
  .select-hint{font-size:13px;color:var(--ink-dim);margin-top:10px;text-align:center;}

  .score-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;}
  @media(max-width:640px){.score-grid{grid-template-columns:1fr;}}
  .radar-wrap{display:flex;align-items:center;justify-content:center;}
  .bars{display:flex;flex-direction:column;gap:16px;justify-content:center;}
  .bar-row .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:var(--ink-dim);}
  .bar-track{height:12px;border-radius:99px;background:rgba(255,255,255,0.06);overflow:hidden;}
  .bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0%;transition:width 1.1s cubic-bezier(.4,0,.2,1);}

  .reflection-list{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:12px;}
  .reflection-list li{
    padding:14px 16px;border-radius:var(--radius-sm);background:rgba(255,255,255,0.03);
    border:1px solid var(--panel-border);font-size:14px;line-height:1.55;display:flex;gap:10px;
  }
  .reflection-list li .ico{font-size:18px;flex-shrink:0;}

  .celebration{text-align:center;padding:36px 20px;}
  .celebration .big-emoji{font-size:60px;animation:pop .6s cubic-bezier(.34,1.56,.64,1);}
  @keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.15);}100%{transform:scale(1);}}
  .confetti-piece{position:fixed;top:-20px;width:8px;height:14px;opacity:.9;z-index:5;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:0;}}

  .start-screen{text-align:center;padding:60px 20px 20px;}
  .start-screen h2{font-size:24px;margin-bottom:8px;}
  .start-screen p{color:var(--ink-dim);max-width:520px;margin:0 auto 24px;line-height:1.6;}

  .hidden{display:none !important;}
  .question-counter{text-align:center;color:var(--ink-dim);font-size:12.5px;margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:99px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important; transition-duration:.001s !important;}
  }
</style>
</head>
<body>
<div class="bg-orbs"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>

<div class="wrap">
  <header class="top">
    <h1>Task Compass</h1>
    <p>Learn how work flows through real organizations.</p>
  </header>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-stages">
      <span id="pl1">1 - Who Owns This?</span>
      <span id="pl2">2 - Task Routing</span>
      <span id="pl3">3 - Collaboration</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <div id="app"></div>
</div>

<script>
(function(){

var ROLES = {
  fe:  {name:"Frontend Developer", emoji:"🖥️", color:"var(--frontend)"},
  be:  {name:"Backend Developer",  emoji:"🗄️", color:"var(--backend)"},
  qa:  {name:"QA Engineer",        emoji:"🔍", color:"var(--qa)"},
  pm:  {name:"Product Manager",    emoji:"🧩", color:"var(--pm)"},
  ux:  {name:"UX Designer",        emoji:"🎨", color:"var(--ux)"},
  cs:  {name:"Customer Support",   emoji:"💬", color:"var(--support)"},
  em:  {name:"Engineering Manager",emoji:"🧭", color:"var(--em)"},
  sales:{name:"Sales / Marketing", emoji:"📈", color:"var(--sales)"}
};
var ROLE_KEYS = Object.keys(ROLES);

var STAGE1 = [
  {task:"A customer reports that payments fail only on iPhones.",
   owner:"fe", why:"Payment failures isolated to one platform usually trace back to how the interface renders or calls checkout code on that device, so this falls to frontend.",
   assist:["qa","be"]},
  {task:"The database is returning slow query results during peak hours.",
   owner:"be", why:"Query performance and database load are backend infrastructure concerns; the backend engineer owns the data layer and its optimization.",
   assist:["em"]},
  {task:"Users are confused about where to click to reset their password.",
   owner:"ux", why:"Confusion about navigation and flow is a design clarity problem. UX owns how intuitive the interface feels, even if no code is broken.",
   assist:["fe","cs"]},
  {task:"A new feature was released with three critical bugs.",
   owner:"qa", why:"Bugs slipping into a release point to gaps in test coverage. QA owns the verification process that should have caught them before launch.",
   assist:["fe","be"]},
  {task:"The team cannot agree on which feature to build next quarter.",
   owner:"pm", why:"Prioritization across competing ideas is a product decision. The PM owns the roadmap and translates business goals into what gets built.",
   assist:["em","sales"]},
  {task:"A user emails asking how to export their data as a CSV.",
   owner:"cs", why:"A how-to question from an existing user is a direct support request. Customer Support owns first-line answers and only escalates if it is a bug or missing feature.",
   assist:["pm"]},
  {task:"Two engineers disagree on which framework to use for a new service.",
   owner:"em", why:"Technical direction conflicts between engineers are resolved by the person who owns team-level technical decisions and long-term maintainability: the Engineering Manager.",
   assist:["be"]},
  {task:"The signup button does not visually match the rest of the site.",
   owner:"ux", why:"Visual inconsistency is a design system issue. UX owns the visual language, even though a frontend developer will implement the fix.",
   assist:["fe"]},
  {task:"An API endpoint is returning a 500 error intermittently.",
   owner:"be", why:"Server errors originate in backend logic or infrastructure. The backend developer owns diagnosing and fixing endpoint failures.",
   assist:["qa","em"]},
  {task:"A competitor just launched a feature your users have been requesting for months.",
   owner:"pm", why:"Deciding how to respond to competitive pressure is a strategic product call. The PM owns weighing this against the existing roadmap.",
   assist:["sales","em"]}
];

var STAGE2 = [
  {task:"A customer reports a bug through the help center.",
   order:["cs","qa","be","fe"],
   note:"Support first confirms the issue is real and gathers details. QA reproduces and verifies severity. Backend fixes the root cause if it is server-side, and frontend adjusts anything visible before it ships back to the customer."},
  {task:"A user requests a brand-new feature that does not exist yet.",
   order:["cs","pm","ux","be","fe"],
   note:"Support logs the request. Product decides if and when it fits the roadmap. UX designs the experience, backend builds the data and logic layer, and frontend brings it to life on screen."},
  {task:"QA finds a bug in a feature that is about to launch.",
   order:["qa","be","fe","qa"],
   note:"QA flags it early. Whichever side owns the code, backend or frontend, fixes it, then QA re-verifies before the release goes out: a short loop, not a long chain."},
  {task:"An engineer proposes a risky change to core infrastructure.",
   order:["be","em","qa"],
   note:"The engineer proposes the change, the Engineering Manager weighs the risk against team priorities and approves scope, then QA validates it does not break anything before rollout."},
  {task:"Marketing wants a landing page for a big campaign next week.",
   order:["sales","pm","ux","fe"],
   note:"Sales and Marketing bring the request and deadline. Product scopes what is realistic. UX designs the page, and frontend builds it fast within that scope."},
  {task:"A security vulnerability is discovered in the login system.",
   order:["be","em","qa","fe"],
   note:"Backend patches the vulnerability first since it is urgent. The Engineering Manager coordinates priority and communication. QA verifies the fix is solid, and frontend updates anything user-facing, like a forced password reset."}
];

var STAGE3 = [
  {situation:"Customer satisfaction suddenly drops.",
   owner:"pm",
   support:["cs","qa","ux"],
   reasoning:"A sudden satisfaction drop rarely has one cause. Product coordinates the investigation, Support surfaces what customers are actually saying, QA checks if a recent release introduced instability, and UX reviews whether a recent change made the product harder to use.",
   flow:"Support surfaces patterns, then Product routes to QA and UX to investigate root cause, then Product decides the response, then Support communicates the fix to customers."},
  {situation:"Sales increase dramatically.",
   owner:"em",
   support:["be","pm","sales"],
   reasoning:"A sudden spike is a scaling problem before it is a celebration. Engineering Management ensures infrastructure can handle load, Backend monitors and scales systems, Product tracks which feature or channel drove the surge, and Sales and Marketing decide how to capitalize on the momentum.",
   flow:"Sales and Marketing report the spike, Engineering Manager checks system health, Backend scales infrastructure, Product analyzes the cause, then Sales and Marketing plan follow-up."},
  {situation:"Negative reviews appear online.",
   owner:"pm",
   support:["cs","ux","sales"],
   reasoning:"Reviews often blend real product issues with perception issues. Product owns triaging what is true, Support responds directly to affected users, UX checks if the complaints point to a usability problem, and Sales and Marketing manage public reputation and messaging.",
   flow:"Support flags patterns in complaints, Product triages root causes, UX reviews the usability angle, then Sales and Marketing manage the public response."},
  {situation:"A major feature is delayed.",
   owner:"em",
   support:["pm","be","fe"],
   reasoning:"Delays are a coordination problem, not just a coding one. The Engineering Manager assesses what is realistically blocking progress, Product decides whether to adjust scope or timeline, and Backend and Frontend report what is actually left to finish.",
   flow:"Backend and Frontend report blockers, Engineering Manager assesses the timeline, Product adjusts scope or communicates the delay, and Sales and Marketing step in if customer-facing communication is needed."}
];

function pick(arr,n){
  var copy = arr.slice();
  var out = [];
  while(out.length < n && copy.length){
    var i = Math.floor(Math.random()*copy.length);
    out.push(copy.splice(i,1)[0]);
  }
  return out;
}

var gameData = {
  stage1: pick(STAGE1,3),
  stage2: pick(STAGE2,3),
  stage3: pick(STAGE3,3)
};

var state = {
  stage:0,
  q:0,
  scores:{ownership:0,delegation:0,collaboration:0,workflow:0},
  maxScores:{ownership:9,delegation:9,collaboration:9,workflow:9},
  log:[]
};

var app = document.getElementById('app');
var progressFill = document.getElementById('progressFill');
var pl1 = document.getElementById('pl1');
var pl2 = document.getElementById('pl2');
var pl3 = document.getElementById('pl3');

function updateProgress(){
  var totalQ = 9;
  var done = state.stage===0 ? 0 : (state.stage-1)*3 + state.q;
  progressFill.style.width = Math.min(100,(done/totalQ)*100)+"%";
  [pl1,pl2,pl3].forEach(function(el,i){ el.classList.toggle('active', state.stage===i+1); });
  document.getElementById('progressWrap').style.display = (state.stage===0 || state.stage===4) ? 'none' : 'block';
}

function roleCardHTML(key, draggable){
  if(draggable === undefined) draggable = true;
  var r = ROLES[key];
  return '<div class="role-card" draggable="'+draggable+'" data-role="'+key+'" style="--role-color:'+r.color+'">' +
    '<div class="dot"></div>' +
    '<span class="emoji">'+r.emoji+'</span>' +
    '<span class="name">'+r.name+'</span>' +
    '</div>';
}

/* ============= START ============= */
function renderStart(){
  app.innerHTML =
    '<div class="panel start-screen">' +
      '<div style="font-size:50px;margin-bottom:10px;">🧭</div>' +
      '<h2>Welcome to Task Compass</h2>' +
      '<p>You are about to step into a <strong>Tech Company</strong>. You will face real workplace tickets, decide who owns them, route them through the team, and tackle bigger cross-department challenges. This is not a quiz, it is a management simulation.</p>' +
      '<button class="btn" id="beginBtn">Begin Simulation</button>' +
    '</div>';
  document.getElementById('beginBtn').onclick = function(){
    state.stage = 1; state.q = 0; renderStage1();
  };
  updateProgress();
}

/* ============= STAGE 1 ============= */
function renderStage1(){
  updateProgress();
  if(state.q === 0){
    app.innerHTML =
      '<div class="stage-intro">' +
        '<span class="badge">Stage 1</span>' +
        '<h2>Who Owns This?</h2>' +
        '<p>A task lands on the team\u2019s desk. Drag the role that should <strong>own</strong> it into the slot below. Ownership means: who is ultimately responsible for seeing it through.</p>' +
      '</div>';
    setTimeout(renderStage1Question, 400);
    return;
  }
  renderStage1Question();
}

function renderStage1Question(){
  var item = gameData.stage1[state.q];
  var roleHTML = ROLE_KEYS.map(function(k){ return roleCardHTML(k); }).join('');
  app.innerHTML =
    '<div class="question-counter">Question '+(state.q+1)+' of 3</div>' +
    '<div class="panel">' +
      '<div class="ticket">' +
        '<div class="tag">Incoming Ticket</div>' +
        '<h3>'+item.task+'</h3>' +
        '<p class="meta">Drag the role who should own this into the slot.</p>' +
      '</div>' +
      '<div class="roles-grid" id="roleGrid">'+roleHTML+'</div>' +
      '<div class="dropzone" id="dropzone">Drop the owning role here</div>' +
      '<div id="revealArea"></div>' +
      '<div class="actions" id="actionsArea"></div>' +
    '</div>';
  setupDragDrop(function(key){ revealStage1(item, key); });
}

function revealStage1(item, chosenKey){
  var correct = chosenKey === item.owner;
  if(correct){
    state.scores.ownership++;
  } else if(item.assist.indexOf(chosenKey) !== -1){
    state.scores.delegation += 0.5;
  }
  state.log.push({stage:1, correct:correct, task:item.task, chosen:chosenKey, correctAnswer:item.owner});

  var ownerR = ROLES[item.owner];
  var chosenR = ROLES[chosenKey];
  var assistChips = item.assist.map(function(k){
    return '<span class="assist-chip">'+ROLES[k].emoji+' '+ROLES[k].name+'</span>';
  }).join('');

  var headline = correct ?
    'Matched the primary owner' :
    'You picked '+chosenR.name+'. The primary owner is '+ownerR.name;

  document.getElementById('revealArea').innerHTML =
    '<div class="reveal">' +
      '<h4>'+(correct ? '✓' : '↺')+' '+headline+'</h4>' +
      '<p><strong>'+ownerR.emoji+' '+ownerR.name+'</strong> owns this because: '+item.why+'</p>' +
      '<p>May assist:</p>' +
      '<div class="assist-list">'+assistChips+'</div>' +
    '</div>';

  var grid = document.getElementById('roleGrid');
  grid.style.pointerEvents = 'none';
  grid.style.opacity = '.5';

  document.getElementById('actionsArea').innerHTML =
    '<button class="btn" id="nextBtn">'+(state.q < 2 ? 'Next Ticket' : 'Continue to Stage 2')+'</button>';
  document.getElementById('nextBtn').onclick = function(){
    state.q++;
    if(state.q > 2){ state.stage = 2; state.q = 0; renderStage2(); }
    else renderStage1Question();
  };
}

/* ============= STAGE 2 ============= */
function renderStage2(){
  updateProgress();
  if(state.q === 0){
    app.innerHTML =
      '<div class="stage-intro">' +
        '<span class="badge">Stage 2</span>' +
        '<h2>Task Routing</h2>' +
        '<p>Now you manage incoming work. Drag role cards into order to build the workflow a task should follow, from first touch to resolution.</p>' +
      '</div>';
    setTimeout(renderStage2Question, 400);
    return;
  }
  renderStage2Question();
}

function renderStage2Question(){
  var item = gameData.stage2[state.q];
  var n = item.order.length;
  var roleHTML = ROLE_KEYS.map(function(k){ return roleCardHTML(k); }).join('');
  var slots = '';
  for(var i=0;i<n;i++){
    slots += '<div class="route-slot" data-index="'+i+'">Step '+(i+1)+'</div>';
    if(i < n-1) slots += '<span class="route-arrow">→</span>';
  }
  app.innerHTML =
    '<div class="question-counter">Question '+(state.q+1)+' of 3</div>' +
    '<div class="panel">' +
      '<div class="ticket">' +
        '<div class="tag">Workflow Ticket</div>' +
        '<h3>'+item.task+'</h3>' +
        '<p class="meta">Build the '+n+'-step path this task should take through the team, in order.</p>' +
      '</div>' +
      '<div class="roles-grid" id="roleGrid">'+roleHTML+'</div>' +
      '<div class="route-slots" id="routeSlots">'+slots+'</div>' +
      '<div class="actions" id="actionsArea">' +
        '<button class="btn" id="submitRoute" disabled>Submit Route</button>' +
      '</div>' +
      '<div id="revealArea"></div>' +
    '</div>';
  setupRouteDragDrop(n);
}

function setupRouteDragDrop(n){
  var cards = document.querySelectorAll('#roleGrid .role-card');
  var slots = document.querySelectorAll('.route-slot');
  var filled = new Array(n).fill(null);

  function fillSlot(slot, key){
    var idx = parseInt(slot.getAttribute('data-index'), 10);
    filled[idx] = key;
    var r = ROLES[key];
    slot.classList.add('filled');
    slot.innerHTML = '<div class="filled-card"><span style="font-size:20px">'+r.emoji+'</span>'+r.name+'</div>';
    var btn = document.getElementById('submitRoute');
    btn.disabled = filled.indexOf(null) !== -1;
  }

  cards.forEach(function(card){
    card.addEventListener('dragstart', function(e){
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', card.getAttribute('data-role'));
    });
    card.addEventListener('dragend', function(){ card.classList.remove('dragging'); });
    card.addEventListener('click', function(){
      var openSlot = null;
      for(var i=0;i<slots.length;i++){
        if(!filled[i]){ openSlot = slots[i]; break; }
      }
      if(openSlot){ fillSlot(openSlot, card.getAttribute('data-role')); }
    });
  });

  slots.forEach(function(slot){
    slot.addEventListener('dragover', function(e){ e.preventDefault(); slot.classList.add('dragover'); });
    slot.addEventListener('dragleave', function(){ slot.classList.remove('dragover'); });
    slot.addEventListener('drop', function(e){
      e.preventDefault();
      slot.classList.remove('dragover');
      var key = e.dataTransfer.getData('text/plain');
      fillSlot(slot, key);
    });
  });

  document.getElementById('submitRoute').onclick = function(){
    revealStage2(gameData.stage2[state.q], filled);
  };
}

function revealStage2(item, chosenOrder){
  var correct = JSON.stringify(chosenOrder) === JSON.stringify(item.order);
  var partialMatches = 0;
  for(var i=0;i<item.order.length;i++){
    if(chosenOrder[i] === item.order[i]) partialMatches++;
  }
  if(correct){ state.scores.workflow += 3; }
  else{ state.scores.workflow += (partialMatches/item.order.length)*2; }
  state.scores.delegation += 1;
  state.log.push({stage:2, correct:correct, task:item.task, chosenOrder:chosenOrder, correctOrder:item.order});

  document.getElementById('actionsArea').innerHTML = '';
  document.querySelectorAll('#roleGrid .role-card').forEach(function(c){ c.style.pointerEvents = 'none'; });

  var orderText = item.order.map(function(k){ return ROLES[k].emoji+' '+ROLES[k].name; }).join(' → ');
  var headline = correct ? 'Perfect route' : 'Here is the commonly used path';

  var revealArea = document.getElementById('revealArea');
  revealArea.innerHTML =
    '<div class="flow-anim" id="flowAnim"><div class="flow-line"></div></div>' +
    '<div class="reveal">' +
      '<h4>'+(correct ? '✓' : '↺')+' '+headline+'</h4>' +
      '<p><strong>Suggested order:</strong> '+orderText+'</p>' +
      '<p>'+item.note+'</p>' +
    '</div>' +
    '<div class="actions" style="margin-top:20px;">' +
      '<button class="btn" id="nextBtn2">'+(state.q < 2 ? 'Next Task' : 'Continue to Stage 3')+'</button>' +
    '</div>';

  animateFlow();

  document.getElementById('nextBtn2').onclick = function(){
    state.q++;
    if(state.q > 2){ state.stage = 3; state.q = 0; renderStage3(); }
    else renderStage2Question();
  };
}

function animateFlow(){
  var anim = document.getElementById('flowAnim');
  if(!anim) return;
  var token = document.createElement('div');
  token.className = 'flow-token';
  token.textContent = '📦';
  token.style.left = '0%';
  anim.appendChild(token);
  setTimeout(function(){
    token.style.transition = 'left 1.8s cubic-bezier(.4,0,.2,1)';
    token.style.left = '100%';
  }, 100);
}

/* ============= STAGE 3 ============= */
function renderStage3(){
  updateProgress();
  if(state.q === 0){
    app.innerHTML =
      '<div class="stage-intro">' +
        '<span class="badge">Stage 3</span>' +
        '<h2>Collaboration Challenge</h2>' +
        '<p>Bigger situations rarely belong to one person. Select up to <strong>4 roles</strong> who should be involved. Think about who owns it and who supports it.</p>' +
      '</div>';
    setTimeout(renderStage3Question, 400);
    return;
  }
  renderStage3Question();
}

function renderStage3Question(){
  var item = gameData.stage3[state.q];
  var roleHTML = ROLE_KEYS.map(function(k){ return roleCardHTML(k, false); }).join('');
  app.innerHTML =
    '<div class="question-counter">Question '+(state.q+1)+' of 3</div>' +
    '<div class="panel">' +
      '<div class="ticket">' +
        '<div class="tag">Situation Report</div>' +
        '<h3>'+item.situation+'</h3>' +
        '<p class="meta">Select up to 4 roles or departments that should be involved.</p>' +
      '</div>' +
      '<div class="roles-grid multi-roles" id="roleGridMulti">'+roleHTML+'</div>' +
      '<p class="select-hint" id="selectHint">0 / 4 selected</p>' +
      '<div class="actions"><button class="btn" id="submitMulti" disabled>Submit Team</button></div>' +
      '<div id="revealArea"></div>' +
    '</div>';

  var selected = [];
  var cards = document.querySelectorAll('#roleGridMulti .role-card');
  cards.forEach(function(card){
    card.addEventListener('click', function(){
      var key = card.getAttribute('data-role');
      var idx = selected.indexOf(key);
      if(idx !== -1){
        selected.splice(idx,1);
        card.classList.remove('selected');
      } else {
        if(selected.length >= 4) return;
        selected.push(key);
        card.classList.add('selected');
      }
      document.getElementById('selectHint').textContent = selected.length + ' / 4 selected';
      document.getElementById('submitMulti').disabled = selected.length === 0;
    });
  });

  document.getElementById('submitMulti').onclick = function(){
    revealStage3(item, selected.slice());
  };
}

function revealStage3(item, chosen){
  var hasOwner = chosen.indexOf(item.owner) !== -1;
  var supportMatches = chosen.filter(function(k){ return item.support.indexOf(k) !== -1; }).length;
  var totalIdeal = 1 + item.support.length;
  var matchScore = (hasOwner ? 1 : 0) + supportMatches;
  state.scores.collaboration += (matchScore/totalIdeal)*3;
  state.scores.ownership += hasOwner ? 1 : 0;
  if(chosen.length >= 2) state.scores.collaboration += 0.5;
  state.log.push({stage:3, situation:item.situation, chosen:chosen, owner:item.owner, support:item.support, tooNarrow: chosen.length < 2});

  document.querySelectorAll('#roleGridMulti .role-card').forEach(function(c){ c.style.pointerEvents = 'none'; });
  var submitBtn = document.getElementById('submitMulti');
  if(submitBtn) submitBtn.remove();

  var ownerR = ROLES[item.owner];
  var supportChips = item.support.map(function(k){
    return '<span class="assist-chip">'+ROLES[k].emoji+' '+ROLES[k].name+'</span>';
  }).join('');

  document.getElementById('revealArea').innerHTML =
    '<div class="reveal">' +
      '<h4>'+(hasOwner ? '✓' : '↺')+' Primary Owner: '+ownerR.emoji+' '+ownerR.name+'</h4>' +
      '<p><strong>Supporting teams:</strong></p>' +
      '<div class="assist-list">'+supportChips+'</div>' +
      '<p style="margin-top:12px;"><strong>Reasoning:</strong> '+item.reasoning+'</p>' +
      '<p><strong>Communication flow:</strong> '+item.flow+'</p>' +
    '</div>' +
    '<div class="actions" style="margin-top:20px;">' +
      '<button class="btn" id="nextBtn3">'+(state.q < 2 ? 'Next Situation' : 'See My Results')+'</button>' +
    '</div>';

  document.getElementById('nextBtn3').onclick = function(){
    state.q++;
    if(state.q > 2){ state.stage = 4; renderResults(); }
    else renderStage3Question();
  };
}

/* ============= RESULTS ============= */
function renderResults(){
  updateProgress();
  var cats = ['ownership','delegation','collaboration','workflow'];
  var labels = {ownership:'Ownership', delegation:'Delegation', collaboration:'Collaboration', workflow:'Workflow Thinking'};
  var pct = {};
  cats.forEach(function(c){
    pct[c] = Math.max(0, Math.min(100, Math.round((state.scores[c]/state.maxScores[c])*100)));
  });

  app.innerHTML =
    '<div class="celebration panel">' +
      '<div class="big-emoji">🎉</div>' +
      '<h2 style="margin:8px 0 4px;">Simulation Complete</h2>' +
      '<p style="color:var(--ink-dim);">Here is how you navigated the organization.</p>' +
    '</div>' +
    '<div class="panel">' +
      '<div class="score-grid">' +
        '<div class="radar-wrap" id="radarWrap"></div>' +
        '<div class="bars" id="barsWrap"></div>' +
      '</div>' +
    '</div>' +
    '<div class="panel">' +
      '<h2 style="margin-top:0;font-size:20px;">Your Reflection</h2>' +
      '<ul class="reflection-list" id="reflectionList"></ul>' +
    '</div>' +
    '<div class="actions">' +
      '<button class="btn ghost" id="restartBtn">Run Simulation Again</button>' +
    '</div>';

  drawRadar(document.getElementById('radarWrap'), cats.map(function(c){ return pct[c]; }), cats.map(function(c){ return labels[c]; }));

  var barsWrap = document.getElementById('barsWrap');
  cats.forEach(function(c){
    var row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML =
      '<div class="lbl"><span>'+labels[c]+'</span><span>'+pct[c]+'%</span></div>' +
      '<div class="bar-track"><div class="bar-fill" data-pct="'+pct[c]+'"></div></div>';
    barsWrap.appendChild(row);
  });
  setTimeout(function(){
    document.querySelectorAll('.bar-fill').forEach(function(el){
      el.style.width = el.getAttribute('data-pct') + '%';
    });
  }, 200);

  renderReflection(pct);
  launchConfetti();

  document.getElementById('restartBtn').onclick = function(){ location.reload(); };
}

function drawRadar(container, values, labels){
  var size = 280, center = size/2, maxR = size/2 - 46;
  var n = values.length;
  function angle(i){ return (Math.PI*2*i/n) - Math.PI/2; }

  var points = values.map(function(v,i){
    var r = (v/100)*maxR;
    var x = center + r*Math.cos(angle(i));
    var y = center + r*Math.sin(angle(i));
    return x+','+y;
  }).join(' ');

  var gridRings = '';
  [0.25,0.5,0.75,1].forEach(function(f){
    var pts = [];
    for(var i=0;i<n;i++){
      var r = f*maxR;
      var x = center + r*Math.cos(angle(i));
      var y = center + r*Math.sin(angle(i));
      pts.push(x+','+y);
    }
    gridRings += '<polygon points="'+pts.join(' ')+'" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>';
  });

  var axisLines = '', labelEls = '';
  labels.forEach(function(lab,i){
    var x = center + maxR*Math.cos(angle(i));
    var y = center + maxR*Math.sin(angle(i));
    axisLines += '<line x1="'+center+'" y1="'+center+'" x2="'+x+'" y2="'+y+'" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>';
    var lx = center + (maxR+26)*Math.cos(angle(i));
    var ly = center + (maxR+26)*Math.sin(angle(i));
    labelEls += '<text x="'+lx+'" y="'+ly+'" fill="#9aa4bd" font-size="11" text-anchor="middle" dominant-baseline="middle">'+lab+'</text>';
  });

  container.innerHTML =
    '<svg viewBox="0 0 '+size+' '+size+'" width="100%" height="280" style="max-width:300px;">' +
      gridRings + axisLines +
      '<polygon points="'+points+'" fill="rgba(94,234,212,0.28)" stroke="#5eead4" stroke-width="2"/>' +
      labelEls +
    '</svg>';
}

function renderReflection(pct){
  var list = document.getElementById('reflectionList');
  var items = [];

  var sorted = Object.keys(pct).map(function(k){ return [k, pct[k]]; }).sort(function(a,b){ return b[1]-a[1]; });
  var strongest = sorted[0][0];
  var labelMap = {ownership:'ownership', delegation:'delegation', collaboration:'collaboration', workflow:'workflow thinking'};

  items.push({ico:'💡', text:'You tended to reason clearly about <strong>'+labelMap[strongest]+'</strong>, a strong foundation for understanding how work gets assigned.'});

  var stage3Narrow = state.log.filter(function(l){ return l.stage===3 && l.tooNarrow; }).length;
  if(stage3Narrow > 0){
    items.push({ico:'🔎', text:'In some collaboration challenges, you selected only one role. Complex situations often involve more hands than they first appear to.'});
  } else {
    items.push({ico:'🤝', text:'You generally reached for multiple roles in complex situations, a sign you are thinking in terms of teams, not individuals.'});
  }

  var stage1Wrong = state.log.filter(function(l){ return l.stage===1 && !l.correct; }).length;
  if(stage1Wrong > 0){
    items.push({ico:'⚖️', text:'A few times you assigned ownership to a role that was better suited as support. It is a common instinct: the person closest to the symptom is not always the one who owns the fix.'});
  } else {
    items.push({ico:'🎯', text:'You consistently identified the right primary owner, even when several roles were plausible.'});
  }

  items.push({ico:'🌐', text:'Many real workplace problems are solved by teams rather than individuals. Ownership starts the work, but collaboration usually finishes it.'});

  list.innerHTML = items.map(function(it){
    return '<li><span class="ico">'+it.ico+'</span><span>'+it.text+'</span></li>';
  }).join('');
}

function launchConfetti(){
  var colors = ['#5eead4','#818cf8','#fb7185','#fbbf24','#4ade80'];
  for(var i=0;i<40;i++){
    var el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = (Math.random()*100)+'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (2+Math.random()*2)+'s';
    el.style.animationDelay = (Math.random()*0.6)+'s';
    document.body.appendChild(el);
    (function(node){ setTimeout(function(){ node.remove(); }, 4500); })(el);
  }
}

/* ============= DRAG/DROP (Stage 1) ============= */
function setupDragDrop(onDrop){
  var cards = document.querySelectorAll('#roleGrid .role-card');
  var zone = document.getElementById('dropzone');
  var placed = false;

  function placeInZone(key){
    if(placed) return;
    placed = true;
    var r = ROLES[key];
    zone.classList.add('filled');
    zone.innerHTML = '<div class="filled-card"><span style="font-size:22px">'+r.emoji+'</span>'+r.name+'</div>';
    onDrop(key);
  }

  cards.forEach(function(card){
    card.addEventListener('dragstart', function(e){
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', card.getAttribute('data-role'));
    });
    card.addEventListener('dragend', function(){ card.classList.remove('dragging'); });
    card.addEventListener('click', function(){
      placeInZone(card.getAttribute('data-role'));
    });
  });

  zone.addEventListener('dragover', function(e){ e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', function(){ zone.classList.remove('dragover'); });
  zone.addEventListener('drop', function(e){
    e.preventDefault();
    zone.classList.remove('dragover');
    var key = e.dataTransfer.getData('text/plain');
    placeInZone(key);
  });
}

/* ============= INIT ============= */
renderStart();

})();
</script>
